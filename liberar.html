<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0e0e12">
<title>LarreTech</title>
<style>
:root{--azul:#2563eb;--fundo:#0e0e12;--cartao:#17171f;--linha:#2a2a36;--texto:#f2f2f5;--suave:#9a9aab;--verde:#1f9d55}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--texto);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:1.35rem;margin:6px 0 4px}
.sub{color:var(--suave);margin:0 0 14px;font-size:.92rem;line-height:1.45}
.prazo{display:flex;gap:8px;margin:0 0 16px}
.prazo button{flex:1;border:1.5px solid var(--linha);background:var(--cartao);color:var(--texto);border-radius:12px;padding:10px;font-weight:700;font-size:.95rem}
.prazo button.on{border-color:var(--azul);background:#1b2a52}
h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--suave);margin:18px 0 8px}
.proj{width:100%;text-align:left;border:1px solid var(--linha);background:var(--cartao);color:var(--texto);border-radius:14px;padding:13px 14px;margin-bottom:8px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:1rem;font-weight:600}
.proj small{color:var(--suave);font-weight:400;font-size:.8rem}
.proj.on{border-color:var(--azul)}
.gerado{background:#121a2e;border:1.5px solid var(--azul);border-radius:16px;padding:14px;margin:6px 0 14px}
.gerado b{display:block;margin-bottom:6px}
.gerado code{display:block;background:#0b1020;border-radius:10px;padding:10px;font-size:.74rem;word-break:break-all;color:#c9d6ff;margin:6px 0}
.gerado .ate{color:#9fd3ff;font-size:.88rem;margin:4px 0 10px}
.bts{display:grid;gap:8px}
.bt{border:0;border-radius:12px;padding:13px;font-weight:800;font-size:1rem;text-align:center;text-decoration:none;display:block;cursor:pointer}
.bt.azul{background:var(--azul);color:#fff}.bt.verde{background:var(--verde);color:#fff}.bt.cinza{background:#262633;color:var(--texto)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:#111;border-radius:99px;padding:10px 18px;font-weight:700;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
.bloqueio{text-align:center;padding-top:30vh;color:var(--suave)}
</style>
</head>
<body>
<main id="app"><p class="bloqueio">Carregando…</p></main>
<div class="toast" id="toast" role="status"></div>

  var GUARDA = "larre-liberar";
  var app = document.getElementById("app");
  var toastT;
  function toast(m) { var t = document.getElementById("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove("on"); }, 2200); }
  function esc(t) { return String(t).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function b64url(bytes) { var s = ""; bytes.forEach(function (b) { s += String.fromCharCode(b); }); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
  function deB64(t) { var bin = atob(t.replace(/-/g, "+").replace(/_/g, "/")), out = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }

  // 1ª vez no aparelho: o link de ativação traz a chave depois do # (não vai pra internet). Guarda e limpa o endereço.
  if (location.hash.indexOf("#k=") === 0) {
    try { localStorage.setItem(GUARDA, new TextDecoder().decode(deB64(location.hash.slice(3)))); } catch (e) {}
    history.replaceState(null, "", location.pathname + location.search);
  }
  var jwk;
  try { jwk = JSON.parse(localStorage.getItem(GUARDA)); } catch (e) { jwk = null; }
  if (!jwk || !jwk.d || !window.crypto || !crypto.subtle) {
    app.innerHTML = '<p class="bloqueio">Página não disponível.</p>';
    return;
  }

  var projetos, chave, horas = 1, aberto = null;
  var enc = new TextEncoder();
  crypto.subtle.digest("SHA-256", enc.encode("liberar|" + jwk.d))
    .then(function (h) { return crypto.subtle.importKey("raw", h, "AES-GCM", false, ["decrypt"]); })
    .then(function (k) { var p = deB64(PACOTE); return crypto.subtle.decrypt({ name: "AES-GCM", iv: p.slice(0, 12) }, k, p.slice(12)); })
    .then(function (buf) {
      projetos = JSON.parse(new TextDecoder().decode(buf));
      return crypto.subtle.importKey("jwk", { kty: jwk.kty, crv: jwk.crv, x: jwk.x, y: jwk.y, d: jwk.d }, { name: "ECDSA", namedCurve: "P-256" }, false, ["sign"]);
    })
    .then(function (k) {
      chave = k;
      var pedido = new URLSearchParams(location.search).get("site");
      desenhar();
      if (pedido) gerar(pedido);
    })
    .catch(function () { app.innerHTML = '<p class="bloqueio">Página não disponível.</p>'; });

  function desenhar() {
    var grupo = function (tipo, titulo) {
      return "<h2>" + titulo + "</h2>" + projetos.filter(function (p) { return p.tipo === tipo; }).map(function (p) {
        return '<button class="proj' + (aberto === p.id ? " on" : "") + '" data-id="' + p.id + '">' + esc(p.nome) +
          "<small>" + (p.aberto ? "aberto" : "🔒 " + horas + " h") + "</small></button>" + (aberto === p.id ? '<div id="gerado"></div>' : "");
      }).join("");
    };
    app.innerHTML = "<h1>Liberar demonstração</h1>" +
      '<p class="sub">Toque no projeto: sai um link novo que abre a prévia só pelo tempo escolhido. Depois ele fecha sozinho no celular do cliente.</p>' +
      '<div class="prazo">' + [1, 2, 3].map(function (h) { return '<button data-h="' + h + '" class="' + (h === horas ? "on" : "") + '">' + h + " hora" + (h > 1 ? "s" : "") + "</button>"; }).join("") + "</div>" +
      grupo("sistema", "Sistemas") + grupo("site", "Sites");
  }

  function hora(ms) { var d = new Date(ms); return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2); }

  function gerar(id) {
    var p = projetos.find(function (x) { return x.id === id; });
    if (!p) return;
    aberto = id; desenhar();
    var fim = Math.floor(Date.now() / 1000) + horas * 3600;
    var assinar = p.aberto ? Promise.resolve(null)
      : crypto.subtle.sign({ name: "ECDSA", hash: "SHA-256" }, chave, enc.encode(p.id + "|" + fim)).then(function (s) { return fim + "." + b64url(new Uint8Array(s)); });
    assinar.then(function (token) {
      var links = p.links.map(function (l) { return [l[0], token ? l[1] + (l[1].indexOf("?") >= 0 ? "&" : "?") + "prev=" + token : l[1]]; });
      var lista = links.length === 1 ? links[0][1] : links.map(function (l) { return l[0] + ": " + l[1]; }).join("\n");
      var oQue = (p.tipo === "sistema" ? "o sistema " : "o site ") + p.nome;
      var msg = "Oi! Aqui é o Felipe, da LarreTech. 👋\nSegue o link pra você ver " + oQue + " funcionando:\n\n" + lista + "\n\n" +
        (token ? "O link fica aberto por " + horas + " hora" + (horas > 1 ? "s" : "") + " (até as " + hora(fim * 1000) + "). " : "") +
        "Dá uma olhada com calma e me diz o que achou. Se surgir qualquer dúvida, a gente marca uma reunião. 😉";
      var caixa = document.getElementById("gerado");
      caixa.innerHTML = '<div class="gerado"><b>' + esc(p.nome) + "</b>" +
        links.map(function (l) { return "<code>" + esc(l[0]) + ": " + esc(l[1]) + "</code>"; }).join("") +
        (token ? '<div class="ate">Abre até as <b style="display:inline">' + hora(fim * 1000) + "</b> de hoje</div>" : '<div class="ate">Site aberto, sem prazo.</div>') +
        '<div class="bts"><button class="bt azul" data-copiar="msg">Copiar mensagem com o link</button>' +
        '<button class="bt cinza" data-copiar="link">Copiar só o link</button>' +
        '<a class="bt verde" href="https://wa.me/?text=' + encodeURIComponent(msg) + '" target="_blank" rel="noopener noreferrer">Mandar no WhatsApp</a></div></div>';
      caixa.dataset.msg = msg; caixa.dataset.link = links[0][1];
      caixa.scrollIntoView({ block: "center" });
    });
  }

  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-id]"), h = e.target.closest("[data-h]"), c = e.target.closest("[data-copiar]");
    if (h) { horas = +h.dataset.h; var a = aberto; aberto = null; desenhar(); if (a) gerar(a); }
    if (b) gerar(b.dataset.id);
    if (c) {
      var caixa = document.getElementById("gerado"); var texto = caixa.dataset[c.dataset.copiar];
      (navigator.clipboard ? navigator.clipboard.writeText(texto) : Promise.reject()).then(function () { toast("Copiado"); }, function () { prompt("Copie:", texto); });
    }
  });
})();
</script>
